name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests + Testcontainers integration test (Docker is available on GitHub runners)
      - name: Build and test
        run: mvn -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: CDK synth (checks the infrastructure code compiles to a valid template)
        working-directory: infra
        run: npx --yes aws-cdk@2 synth --quiet
